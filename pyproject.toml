[project]
name = "clausewise-ai"
version = "0.1.0"
description = "AI assistant giải thích & phân tích rủi ro hợp đồng bảo hiểm - clause-aware RAG + Policy Risk Scanner"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "loguru>=0.7.0"
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
